name: Fork Release

on:
  push:
    tags: ['fork-v*']

permissions: {}
concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'hxy91819/amp-acp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Validate annotated tag and aggregate source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/fork_release_v1.py source --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Scan tracked release source for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/secret-scan" "$RUNNER_TEMP/gitleaks"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/secret-scan"
          curl -fL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks/tool.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks/tool.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/tool.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/secret-scan" --redact --no-banner
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test src/
      - run: bun run test:binary
      - run: python3 -m unittest discover -s tests -p 'test_fork_release*.py'

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: bun-linux-x64
            os: ubuntu-24.04
            binary: amp-acp
          - platform: linux-arm64
            target: bun-linux-arm64
            os: ubuntu-24.04-arm
            binary: amp-acp
          - platform: darwin-x64
            target: bun-darwin-x64
            os: macos-15-intel
            binary: amp-acp
          - platform: darwin-arm64
            target: bun-darwin-arm64
            os: macos-15
            binary: amp-acp
          - platform: windows-x64
            target: bun-windows-x64
            os: windows-2025
            binary: amp-acp.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Compile standalone adapter
        env:
          BUN_TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
        run: bun build dist/index.js --compile --target="$BUN_TARGET" --outfile "dist/$BINARY_NAME"
      - name: Package and install-smoke the archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          python scripts/fork_release_v1.py pack --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --platform "$PLATFORM" --binary "dist/$BINARY_NAME"
          python scripts/fork_release_v1.py smoke --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --platform "$PLATFORM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: fork-*
          path: release
          merge-multiple: true
      - name: Assemble manifest and checksums for the verified bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/fork_release_v1.py assemble --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fork-release-bundle
          path: release
      - name: Publish draft, verify downloads, then make it public
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/fork_release_v1.py publish --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
